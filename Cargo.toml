[package]
name = "ssh-agent-client-rs"
version = "1.1.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nresare/ssh-agent-client-rs"
description = """
Pure rust implementation of the ssh-agent protocol. It can be used to write clients that interact with the ssh agent.
"""
edition = "2024"
rust-version = "1.89"

[dependencies]
bytes = "1.11"
ssh-key = { version = "0.7.0-rc.11", features = ["crypto"] }
ssh-encoding = "0.3.0"
signature = "3.0"
thiserror = "2.0"

[dev-dependencies]
rand = "0.10"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
interprocess = "2.2"
